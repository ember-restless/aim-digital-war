name: aim
description: "AIM 数字大战 - 手机端"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  socket_io_client: ^2.0.3+1
  path_provider: ^2.1.4
  audioplayers: ^6.6.0
  gal: ^2.3.3
  http: ^1.6.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  audioplayers_platform_interface: ^7.1.0

flutter:
  uses-material-design: true
  fonts:
    - family: PixelFont
      fonts:
        - asset: assets/fonts/aim_pixel.ttf
        - asset: assets/fonts/aim_pixel_latin.ttf
  assets:
    - assets/art/default/pack.json
    - assets/art/default/ui/
    - assets/art/default/units/
    - assets/art/default/portraits/
    - assets/audio/tutorial/
    - assets/audio/bgm/
    - assets/audio/battle/
    - assets/audio/sfx/
    - assets/images/
